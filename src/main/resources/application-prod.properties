# Produção: ligada com a variável SPRING_PROFILES_ACTIVE=prod. Só muda o que é diferente do application.properties.

# A hospedagem escolhe a porta e avisa pela variável PORT.
server.port=${PORT:8080}

# Banco: Postgres (Neon).
# Sem valor padrão de propósito: se faltar a variável, o app nem sobe (melhor que subir com banco vazio).
# CADERNINHO_BANCO no formato jdbc:postgresql://<host>/<banco>?sslmode=require
spring.datasource.url=${CADERNINHO_BANCO}
spring.datasource.username=${CADERNINHO_BANCO_USUARIO}
spring.datasource.password=${CADERNINHO_BANCO_SENHA}

# O Neon grátis cobra pelas horas em que o banco fica ligado, e ele só dorme depois de uns minutos sem conexão.
# Por padrão o Spring deixa 10 conexões abertas para sempre (e renova de tempos em tempos), o que nunca deixa o
# banco dormir. Aqui o pool esvazia depois de 1 minuto parado e o Neon pode desligar sozinho.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0

spring.jpa.show-sql=false

# Sem endereço do site configurado, nenhum navegador consegue chamar a API (melhor falhar fechado).
caderninho.origens=${CADERNINHO_ORIGENS:}

# Atrás do proxy da hospedagem: "native" (Tomcat) lê os cabeçalhos X-Forwarded-* só quando vêm da rede interna.
server.forward-headers-strategy=native

# IP de quem acessa, para o bloqueio de senha errada. No Render a Cloudflare fica na frente, e o
# X-Forwarded-For termina no IP do servidor dela (que muda e é o mesmo para muita gente). O True-Client-IP
# a própria Cloudflare preenche em toda requisição, então ninguém consegue inventar outro IP nele.
caderninho.cabecalho-ip=True-Client-IP

# Não devolver detalhes de erro (stack trace, mensagens internas) para o navegador.
server.error.include-stacktrace=never
server.error.include-message=never
