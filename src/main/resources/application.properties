spring.datasource.url=jdbc:h2:file:./data/caderninho
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=true

# Endereços do frontend que podem chamar a API (CORS). Em produção, CADERNINHO_ORIGENS com o endereço do site.
caderninho.origens=${CADERNINHO_ORIGENS:http://localhost:5173,http://192.168.*.*:5173,http://10.*.*.*:5173}

# Senha da loja e segredo que assina os logins. Ficam fora do git: variáveis de ambiente
# CADERNINHO_SENHA e CADERNINHO_SEGREDO, ou o arquivo config/application.properties (no .gitignore).
caderninho.senha=${CADERNINHO_SENHA:}
caderninho.segredo=${CADERNINHO_SEGREDO:}
